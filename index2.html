<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Bangladesh Travel Map</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #030712;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    /* UI Overlay Instructions */
    .instructions {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #38bdf8;
      padding: 12px 24px;
      border-radius: 30px;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      z-index: 10;
    }

    .instructions h1 {
      font-size: 18px;
      color: #38bdf8;
    }

    .instructions p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Popup Tooltip for Pins */
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #f43f5e;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
      transform: translate(-50%, -120%);
      transition: all 0.1s ease;
      z-index: 100;
    }
  </style>

  <!-- Include Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="instructions">
    <h1>🇧🇩 ৩ডি বাংলাদেশ ট্রাভেল ম্যাপ</h1>
    <p>🖱️ মাউস ঘুরিয়ে ম্যাপ ঘোরান | জুম করুন | পিনে ক্লিক করুন</p>
  </div>

  <div id="tooltip"></div>
  <div id="canvas-container"></div>

  <script>
    // --- 1. THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const tooltip = document.getElementById('tooltip');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -15, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.1; // Don't go below ground

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.5);
    dirLight.position.set(10, -10, 20);
    scene.add(dirLight);

    // --- 2. CREATE 3D BANGLADESH MAP SHAPE ---
    // Approximated 3D Polygon Shape of BD Map
    const bdShape = new THREE.Shape();
    bdShape.moveTo(-1.5, 5);    // Panchagarh / Rangpur
    bdShape.lineTo(1.5, 4.5);   // Mymensingh / Sylhet North
    bdShape.lineTo(4.5, 3.5);   // Jaflong / Sylhet East
    bdShape.lineTo(3.0, 1.0);   // Brahmanbaria
    bdShape.lineTo(4.5, -1.0);  // Chittagong Hill Tracts
    bdShape.lineTo(5.0, -4.5);  // Cox's Bazar / Teknaf
    bdShape.lineTo(3.5, -4.0);  // Chittagong Coast
    bdShape.lineTo(1.0, -3.5);  // Barisal / Kuakata
    bdShape.lineTo(-1.5, -3.5); // Sundarbans / Khulna
    bdShape.lineTo(-3.5, -0.5); // Rajshahi / Jessore
    bdShape.lineTo(-2.5, 2.5);  // Dinajpur
    bdShape.lineTo(-1.5, 5);

    // 3D Extrusion
    const extrudeSettings = {
      steps: 1,
      depth: 1.2,
      bevelEnabled: true,
      bevelThickness: 0.3,
      bevelSize: 0.2,
      bevelSegments: 3
    };

    const geometry = new THREE.ExtrudeGeometry(bdShape, extrudeSettings);
    const material = new THREE.MeshPhongMaterial({
      color: 0x0f172a,
      emissive: 0x0369a1,
      wireframe: false,
      shininess: 80,
      flatShading: true
    });

    const mapMesh = new THREE.Mesh(geometry, material);
    scene.add(mapMesh);

    // Glowing Wireframe Overlay
    const wireframeGeo = new THREE.WireframeGeometry(geometry);
    const wireframeMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 1 });
    const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
    mapMesh.add(wireframe);

    // --- 3. ADD 3D PINS FOR YOUR VISITED PLACES ---
    const visitedPlaces = [
      { name: "সাজেক ভ্যালি", x: 3.5, y: -0.5 },
      { name: "বান্দরবান", x: 4.2, y: -3.0 },
      { name: "রাঙামাটি", x: 3.8, y: -1.5 },
      { name: "কক্সবাজার", x: 4.1, y: -4.0 },
      { name: "চট্টগ্রাম", x: 3.2, y: -2.2 },
      { name: "সিলেট", x: 3.2, y: 2.8 },
      { name: "শ্রীমঙ্গল", x: 2.5, y: 1.8 },
      { name: "জাফলং", x: 3.8, y: 3.2 },
      { name: "সাদা পাথর", x: 3.1, y: 3.3 },
      { name: "টাঙ্গুয়ার হাওর", x: 1.8, y: 3.0 },
      { name: "নীলাদ্রি লেক", x: 1.6, y: 3.3 },
      { name: "শিমুল বাগান", x: 1.5, y: 2.8 },
      { name: "টেকের ঘাট", x: 1.4, y: 3.4 },
      { name: "মেরিন ড্রাইভ বেলি", x: 4.4, y: -4.3 },
      { name: "কুয়াকাটা", x: 0.5, y: -3.3 }
    ];

    const pinsGroup = new THREE.Group();

    // Create 3D Pin Mesh (Cone + Sphere)
    visitedPlaces.forEach(place => {
      const pinContainer = new THREE.Group();
      
      // Pin Head
      const sphereGeo = new THREE.SphereGeometry(0.2, 16, 16);
      const sphereMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);
      sphere.position.z = 1.8;

      // Pin Needle
      const coneGeo = new THREE.ConeGeometry(0.12, 0.6, 16);
      const coneMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
      const cone = new THREE.Mesh(coneGeo, coneMat);
      cone.rotation.x = Math.PI / 2;
      cone.position.z = 1.4;

      // Base Glowing Ring
      const ringGeo = new THREE.RingGeometry(0.15, 0.25, 16);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.z = 1.25;

      pinContainer.add(sphere);
      pinContainer.add(cone);
      pinContainer.add(ring);

      pinContainer.position.set(place.x, place.y, 0);
      pinContainer.userData = { name: place.name };

      pinsGroup.add(pinContainer);
    });

    scene.add(pinsGroup);

    // --- 4. RAYCASTING (HOVER / CLICK INTERACTION) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(pinsGroup.children, true);

      if (intersects.length > 0) {
        // Find parent group that holds userData
        let obj = intersects[0].object;
        while (obj.parent && !obj.userData.name) {
          obj = obj.parent;
        }

        if (obj.userData.name) {
          tooltip.style.display = 'block';
          tooltip.style.left = event.clientX + 'px';
          tooltip.style.top = event.clientY + 'px';
          tooltip.innerHTML = `📍 ${obj.userData.name}`;
          document.body.style.cursor = 'pointer';
        }
      } else {
        tooltip.style.display = 'none';
        document.body.style.cursor = 'default';
      }
    });

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 5. ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Slow idle rotation of the entire map
      mapMesh.rotation.z += 0.001;
      pinsGroup.rotation.z += 0.001;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
